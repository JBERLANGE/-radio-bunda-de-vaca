<!DOCTYPE html>
<html>
<header>
  <div class="logo-area">
    <img class="logo-base" src="assets/vaca-base.png" alt="Logo Rádio Bunda de Vaca">
    <img class="logo-rabo" id="raboVaca" src="assets/rabo.png" alt="">
     <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  </div>

  <h1></h1>
  <p class="subtitulo">Cow's Butt Radio</p>
 <!-- <p>Beradeiras, experimentos tropicais e variações musicais do Brasil e do mundo.</p> -->
</header>

<style>
body {
  font-family: Arial, sans-serif;
  background:#111;
  color:#eee;
  margin:0;
  text-align:center;
}

header {
  background:#1a1a1a;
  padding:30px 20px;
}


h1{  color:#f5c542;  font-size:48px;  
margin-bottom:5px;  letter-spacing:2px;
}
.subtitulo
{  font-size:20px;  color:#ddd; 
 font-style:italic;  letter-spacing:3px;
}


section {
  padding:30px 20px;
}

.card {
  background:#222;
  max-width:650px;
  margin:20px auto;
  padding:20px;
  border-radius:12px;
}

.card h3 {
  color:#ffcc00;
  margin-bottom:10px;
}

audio {
  width:100%;
  margin-top:10px;
}

.pix {
  background:#1a1a1a;
  padding:25px;
  margin-top:30px;
}

small {
  color:#aaa;
}

  .logo-area {
  position: relative;
  width: 640px;
  max-width: 180vw;
  margin: 0 auto 15px auto;
}

.logo-base {
  width: 100%;
 /* display: block; */
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

 
.logo-rabo {
  position: absolute;
  width: 160px;
  left: 248px;
  top: 20px;
  transform-origin: 35px 25px;
  transition: transform 0.08s linear;
  z-index: 10;
}

  
.subtitulo {
  font-size: 20px;
  color: #ddd;
  font-style: italic;
  letter-spacing: 3px;
  margin-top: -5px;
}

  .listas-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
  max-width: 1400px;
  margin: 0 auto;
}

  @media (max-width: 900px) {
  .listas-container {
    grid-template-columns: 1fr;
  }
}

  .tocando-agora {
  background: #222;
  max-width: 760px;
  margin: 25px auto;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 0 18px rgba(255, 204, 0, 0.15);
}

.tocando-agora h2 {
  color: #ffcc00;
  margin-top: 0;
}

#musicaAtual {
  color: #f5c542;
  font-size: 24px;
  margin-bottom: 5px;
}

#descricaoAtual {
  color: #ddd;
  font-style: italic;
}

.controles-radio button {
  background: #ffcc00;
  color: #000;
  border: none;
  padding: 10px 16px;
  margin: 8px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.controles-radio button:hover {
  background: #ffaa00;
}

  .oculta {
  display: none;
}

.botao-lista {
  background: #333;
  color: #ffcc00;
  border: 1px solid #ffcc00;
  padding: 10px 15px;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 10px;
}

.botao-lista:hover {
  background: #444;
}
  
  
</style>
</head>

<body>

<header>

  <div class="tocando-agora">
  <h2>🎙️ Tocando agora</h2>
  <h3 id="musicaAtual">Nenhuma música em execução</h3>
  <p id="descricaoAtual">Escolha uma faixa nas listas abaixo.</p>

  <div class="controles-radio">
    <button onclick="voltarMusica()">⏮ Voltar</button>
    <button onclick="avancarMusica()">⏭ Avançar</button>
  </div>
</div>
  
<div class="listas-container">

  <section>
    <h2>🎧 Beradeiras</h2>
    <div id="beradeiras"></div>
    <button class="botao-lista" onclick="toggleLista('beradeiras')">
   Ver mais músicas
</button>
  </section>
  

  
  <section>
    <h2>📻 Rádio Bunda de Vaca</h2>
    <div id="bvaca"></div>
    <button class="botao-lista" onclick="toggleLista('bvaca')">
  Ver mais músicas
</button>
  </section>
</div>

<div class="pix">
  <h3>💛 Apoie o projeto</h3>
  <p>Contribua via Pix para fortalecer esta rádio autoral independente.</p>
  <p><strong>vacacowmusic@gmail.com</strong></p>
</div>

<footer>
  <p><small>© José Berlange Andrade — Rádio Bunda de Vaca</small></p>
</footer>

<script>
 
const usuarioGitHub = "jberlange";
const repositorio = "-radio-bunda-de-vaca";
const pasta = "musicas";

  const limiteHome = 5;

// Se quiser escolher manualmente as 5 obras, coloque aqui os nomes EXATOS dos arquivos:
const destaqueBD = [
  // "BD__CABOCO_PEREGRINO__VERSAO_ORIGINAL.MP3",
  // "BD__NOME_DA_MUSICA__DESCRICAO.MP3"
];

const destaqueBV = [
  // "BV__SERTANEJO__RAIZ_GOIANO_CLASSICO.MP3",
  // "BV__FORRO__PE_DE_SERRA_TRADICIONAL.MP3"
];
  
const apiURL = `https://api.github.com/repos/${usuarioGitHub}/${repositorio}/contents/${pasta}`;

function limparTitulo(nomeArquivo) {
  let nome = nomeArquivo.replace(/\.[^/.]+$/, "");
  let partes = nome.split("__");

  let estilo = partes[1] || "Desconhecido";
  let descricao = partes[2] || "";

  estilo = estilo.replace(/_/g, " ");
  descricao = descricao.replace(/_/g, " ");

  return {
    estilo: estilo,
    descricao: descricao
  };
}

let listaAudios = [];
let indiceAtual = -1;
const limiteInicial = 5;
  
function criarPlayer(arquivo, destino) {
  const card = document.createElement("div");
  card.className = "card";

  

  const dados = limparTitulo(arquivo.name);
  
  const indiceMusica = listaAudios.length;
  
  const titulo = document.createElement("h3");
  titulo.textContent = dados.estilo;

  const desc = document.createElement("p");
  desc.textContent = dados.descricao;

  const audio = document.createElement("audio");
  audio.controls = true;
  conectarRaboAoAudio(audio);

  listaAudios.push({
  audio: audio,
  estilo: dados.estilo,
  descricao: dados.descricao
});

audio.addEventListener("play", () => {
  indiceAtual = indiceMusica;

  document.getElementById("musicaAtual").textContent = dados.estilo;
  document.getElementById("descricaoAtual").textContent = dados.descricao || "Sem descrição cadastrada.";

  listaAudios.forEach((item, i) => {
    if (i !== indiceAtual) {
      item.audio.pause();
    }
  });
});
  
  const source = document.createElement("source");
  source.src = arquivo.download_url;
  source.type = "audio/mpeg";

  audio.appendChild(source);

  card.appendChild(titulo);
  card.appendChild(desc);
  card.appendChild(audio);
  
 const totalAtual = destino.children.length;

if (totalAtual >= limiteInicial) {
  card.classList.add("oculta");
}
  destino.appendChild(card);
}

function avancarMusica() {
  if (listaAudios.length === 0) return;

  if (indiceAtual < 0) {
    indiceAtual = 0;
  } else {
    listaAudios[indiceAtual].audio.pause();
    indiceAtual = (indiceAtual + 1) % listaAudios.length;
  }

  tocarMusicaAtual();
}

function voltarMusica() {
  if (listaAudios.length === 0) return;

  if (indiceAtual < 0) {
    indiceAtual = 0;
  } else {
    listaAudios[indiceAtual].audio.pause();
    indiceAtual = (indiceAtual - 1 + listaAudios.length) % listaAudios.length;
  }

  tocarMusicaAtual();
}

function tocarMusicaAtual() {
  const item = listaAudios[indiceAtual];

  document.getElementById("musicaAtual").textContent = item.estilo;
  document.getElementById("descricaoAtual").textContent = item.descricao || "Sem descrição cadastrada.";

  item.audio.play();
}
  
  
fetch(apiURL)
  .then(resposta => resposta.json())
  .then(arquivos => {
    const beradeiras = document.getElementById("beradeiras");
    const bvaca = document.getElementById("bvaca");
//* ======
const todosMp3 = arquivos
  .filter(arquivo => arquivo.name.toLowerCase().endsWith(".mp3"));

const arquivosBD = todosMp3
  .filter(arquivo => arquivo.name.toUpperCase().startsWith("BD__"));

const arquivosBV = todosMp3
  .filter(arquivo => arquivo.name.toUpperCase().startsWith("BV__"));

function selecionarDestaques(listaArquivos, destaqueManual) {
  if (destaqueManual.length > 0) {
    return destaqueManual
      .map(nome => listaArquivos.find(arquivo => arquivo.name === nome))
      .filter(Boolean)
      .slice(0, limiteHome);
  }

  return listaArquivos
    .slice()
    .reverse()
    .slice(0, limiteHome);
}

selecionarDestaques(arquivosBD, destaqueBD)
  .forEach(arquivo => criarPlayer(arquivo, beradeiras));

selecionarDestaques(arquivosBV, destaqueBV)
  .forEach(arquivo => criarPlayer(arquivo, bvaca));
    //*----
  })

  
  .catch(erro => {
    document.body.innerHTML += "<p>Erro ao carregar músicas.</p>";
    console.error(erro);
  });

const raboVaca = document.getElementById("raboVaca");
let animacaoRabo;
let audioAtivo = null;

function animarRabo() {
  if (!audioAtivo || audioAtivo.paused || audioAtivo.ended) {
    raboVaca.style.transform = "rotate(0deg)";
    cancelAnimationFrame(animacaoRabo);
    return;
  }
 
  const tempo = Date.now() / 260;
  const angulo = Math.sin(tempo) * 4;

  raboVaca.style.transform = `rotate(${angulo}deg)`;
  animacaoRabo = requestAnimationFrame(animarRabo);
}

function conectarRaboAoAudio(audio) {
  audio.addEventListener("play", () => {
    audioAtivo = audio;
    cancelAnimationFrame(animacaoRabo);
    animarRabo();
  });

  audio.addEventListener("pause", () => {
    raboVaca.style.transform = "rotate(0deg)";
  });

  audio.addEventListener("ended", () => {
    raboVaca.style.transform = "rotate(0deg)";
  });
}

  function toggleLista(idLista) {

  const lista = document.getElementById(idLista);

  const ocultas = lista.querySelectorAll(".oculta");

  const botao = lista.nextElementSibling;

  const escondidas = [...ocultas].some(item =>
    item.style.display !== "block"
  );

  ocultas.forEach(item => {
    item.style.display =
      escondidas ? "block" : "none";
  });

  botao.textContent =
    escondidas
      ? "Mostrar menos"
      : "Ver mais músicas";
}
  
</script>

</body>
</html>
